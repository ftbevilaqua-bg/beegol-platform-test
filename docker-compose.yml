services:
  db:
    image: postgres:16-alpine
    container_name: beegol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beegol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beegol}
      POSTGRES_DB: ${POSTGRES_DB:-beegol}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beegol}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: beegol-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://beegol:beegol@db:5432/beegol}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-beegol.com}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: beegol-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  db_data:
